name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,planner,api]"
      - name: Load pinned Chinook sample DB
        run: python -m secure_query.demo.load_chinook --strict
      - name: Lint
        run: ruff check .
      - name: Package import (no FastAPI on core import; version matches pyproject)
        run: |
          python -c "import secure_query, sys; assert 'fastapi' not in sys.modules, sys.modules"
          python -c "
          import tomllib
          from importlib.metadata import version
          from pathlib import Path
          expected = tomllib.loads(Path('pyproject.toml').read_text()).get('project', {}).get('version')
          got = version('secure-query')
          assert got == expected, (got, expected)
          "
      - name: Unit tests
        run: pytest -q
      - name: Compile must not interpolate SQL
        run: |
          if grep -E 'f["'\''].*\b(SELECT|INSERT|UPDATE|DELETE)\b' src/secure_query/kernel/compile.py; then
            echo "compile.py must not f-string SQL"; exit 1
          fi
      - name: Planner tests reject SQL in model output
        run: pytest -q tests/test_planner.py tests/test_adversarial.py
      - name: Holdout gate (mock — abstain is allowed, wrong is not)
        run: python -m secure_query.evals.run --split holdout --provider mock
      - name: Holdout gate, SQL path (mock)
        run: python -m secure_query.evals.run --split holdout --provider mock --planner sql
