[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-query"
version = "0.2.0"
description = "Governed talk-to-data: LogicalPlan → validate(catalog) → AST compile → audit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "sqlglot>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "duckdb>=0.10",
    "fastapi>=0.110",
    "httpx>=0.27",
]
planner = [
    "openai>=1.40",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]
databricks = [
    "databricks-sql-connector>=3.0",
]

[tool.setuptools.packages.find]
include = ["secure_query*"]

[tool.pytest.ini_options]
testpaths = ["secure_query/tests"]
pythonpath = ["."]
