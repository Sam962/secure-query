[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-query"
version = "0.4.0"
description = "Governed talk-to-data: LogicalPlan → validate(catalog) → AST compile → audit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "sqlglot>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "duckdb>=0.10",
    "fastapi>=0.110",
    "httpx>=0.27",
]
planner = [
    "openai>=1.40",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "duckdb>=0.10",
]
databricks = [
    "databricks-sql-connector>=3.0",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secure_query = ["api/static/*.html", "evals/suites/**/*.json", "evals/suites/**/*.sql", "evals/suites/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["secure_query"]
